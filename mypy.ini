[mypy]
python_version = 3.12
mypy_path = src
ignore_missing_imports = True
warn_unused_configs = True

# Known repo-wide typing debt. Keep this list explicit and shrink it over time
# rather than weakening the type gate globally.
[mypy-francis.governance.approval_projection,francis.kernel.stack]
ignore_errors = True

[mypy-francis.plugin_system.loader,francis.plugin_system.registry]
ignore_errors = True

[mypy-francis.agent.executor,francis.agent.supervised_exec]
ignore_errors = True

[mypy-francis.missions.runtime,francis.missions.store,francis.operations.runtime,francis.trust.tracker]
ignore_errors = True

[mypy-francis.api.routes.domains,francis.api.routes.explanation,francis.api.routes.federation,francis.api.routes.industrial,francis.api.routes.memory_timeline]
ignore_errors = True

[mypy-francis.api.routes.missions,francis.api.routes.operations,francis.api.routes.plugins,francis.api.routes.trust,francis.api.routes.web_learning]
ignore_errors = True

[mypy-francis.world_state.operator_mode,francis.world_state.orb,francis.world_state.snapshot]
ignore_errors = True
