# ==============================================================================
# Francis Capability Catalog
# File: config/capabilities/catalog.yaml
#
# WHAT THIS IS:
#   The authoritative registry of canonical capability IDs.
#
# WHAT THIS IS NOT:
#   - Not an alias file (see aliases.yaml).
#   - Not a permission grant (see trust_permissions_map.yaml).
#   - Not a schedule definition (see schedules.yaml).
#
# CORE PRINCIPLES:
#   1) Canonical IDs are stable and should not be renamed casually.
#   2) Capabilities declare risk + default governance posture.
#   3) Permissions/trust decide whether a caller MAY execute.
#   4) Approvals decide whether execution MUST be confirmed.
#
# SCHEMA (per capability):
#   id: <string>                              # canonical id
#   name: <string>                            # display name
#   summary: <string>                         # short description
#   layer: <foundation|kernel|memory|governance|llm|chat|plugins|higher>
#   domain: <system|chat|continuity|approvals|credentials|domains|...>
#   kind: <read|write|execute|toggle|export|admin>   # high-level action kind
#   risk: <low|medium|high|critical>
#   requires_approval: <bool>                 # default posture (can be overridden by policy)
#   min_trust_level: <number>                 # default trust gate (policy can override)
#   handler:                                  # routing hint for backend
#     type: <api|daemon|worker|ui_only|composite>
#     target: <string>                        # e.g., "francis.api.handlers.continuity:ledger_list"
#   observability:
#     audit: <required|recommended|none>
#     log_level: <DEBUG|INFO|WARNING|ERROR>
#   tags: [ ... ]                             # discoverability
#
# NOTES:
#   - min_trust_level is intentionally numeric and scale-agnostic.
#     Your trust calculator decides meaning; this is a default.
#   - requires_approval describes default governance posture.
#     trust_permissions_map and policy engine determine reality.
# ==============================================================================

version: 1

