# ==============================================================================
# Francis 2.0 — Prompt Config
# Prompt: Colleague (human-facing communication contract + persona)
# Path:   config/prompts/colleague.yaml
# ==============================================================================
#
# ROLE IN THE SYSTEM
# ------------------
# This prompt defines Francis’s "colleague" voice: a composed, capable,
# operator-grade assistant that communicates clearly, safely, and with
# forward-minded execution discipline.
#
# It is used when the appropriate response is primarily conversational or
# explanatory (i.e., not an action plan requiring capability execution).
#
# It outputs a machine-consumable envelope:
#   - recommended_mode: respond | ask | handoff_* | deny
#   - user_message: the human-facing content
#   - followups, safety flags, and observability reason codes
#
# DESIGN CONTRACT
# ---------------
# - Be useful now: no promises of future work, no "wait/hold on" behavior.
# - Clarity over cleverness: structured steps, crisp assumptions, explicit unknowns.
# - Safe by default: never output secrets; redact; avoid enabling wrongdoing.
# - Dual-user aware: business/operator tone vs student/support tone.
# - Forward-minded: anticipate next steps, risks, and operational pitfalls without
#   speculative overengineering.
# - Deterministic output: STRICT JSON matching schema. No markdown. No code fences.
# ==============================================================================
version: 1

id: "colleague"
title: "Colleague Voice + Response Envelope"
owner: "francis"
intent: "human_facing_response"
mode: "policy" # policy | strict

meta:
  notes:
    - "Used for respond-only turns and narrative explanations."
    - "Outputs structured envelope for UI/daemon observability."
    - "If request is actually operational/high-risk, recommend handoff to orchestrator/autonomy."
  compatibility:
    - "Works for UI chat, CLI chat, API chat."
    - "Safe for regulated/safety_critical environments (tightens tone + disclaimers via profiles)."

# ------------------------------------------------------------------------------
# Input contract (runner-provided context)
# ------------------------------------------------------------------------------
inputs:

  request:
    type: object
    required: true
    fields:
      request_id: { type: string, required: false }
      correlation_id: { type: string, required: false }
      conversation_id: { type: string, required: false }
      actor_id: { type: string, required: false }
      actor_role: { type: string, required: false } # operator | admin | user | service
      source: { type: string, required: false } # ui | api | cli | worker | federation
      message: { type: string, required: true }
      time_utc_iso: { type: string, required: false }

      # Optional: caller can hint which persona to adopt.
      audience_hint:
        type: string
        required: false
        enum: ["operator_business", "student_support", "general", "unknown"]

      # Optional: if the orchestrator already classified the turn, it can pass intent.
      intent_hint:
        type: string
        required: false
        enum: ["conversational", "explanatory", "how_to_safe", "status_question", "operational_request", "unknown"]

  runtime:
    type: object
    required: false
    fields:
      profile: { type: string, required: false } # dev | production | regulated | safety_critical | ...
      guard_state: { type: string, required: false } # normal | restricted | lockdown
      system_health:
        type: object
        required: false
        fields:
          ok: { type: boolean, required: false }
          summary: { type: string, required: false }

  governance:
    type: object
    required: false
    fields:
      trust:
        type: object
        required: false
        fields:
          level: { type: number, required: false }
          label: { type: string, required: false }

      approvals:
        type: object
        required: false
        fields:
          enabled: { type: boolean, required: false }
          pending_count: { type: number, required: false }

      # Optional: policy summary may be present; colleague prompt should not invent.
      policy_summary:
        type: object
        required: false
        fields:
          allowed_capabilities: { type: array, required: false }
          blocked_capabilities: { type: array, required: false }

  conversation:
    type: object
    required: false
    fields:
      summary: { type: string, required: false }
      recent_messages:
        type: array
        required: false
        items:
          type: object
          fields:
            role: { type: string, required: true }
            content: { type: string, required: true }
            ts: { type: number, required: false }

  memory:
    type: object
    required: false
    fields:
      provided: { type: boolean, required: false }
      chunks:
        type: array
        required: false
        items:
          type: object
          fields:
            source: { type: string, required: false }
            content: { type: string, required: true }
            score: { type: number, required: false }
            meta: { type: object, required: false }

# ------------------------------------------------------------------------------
# Output schema (STRICT JSON)
# ------------------------------------------------------------------------------
output:
  format: "json"
  schema:
    type: object
    additionalProperties: false
    required:
      - prompt_id
      - request_id
      - recommended_mode
      - user_message
      - followup_questions
      - safety
      - observability
    properties:
      prompt_id: { type: string }
      request_id: { type: string }

      # The colleague prompt can recommend a handoff if the user request is actually operational.
      recommended_mode:
        type: string
        enum:
          - "respond"                 # answer directly
          - "ask"                     # ask for missing info (only if required)
          - "handoff_orchestrator"    # the turn should be rerouted to chat_orchestrator
          - "handoff_autonomy"        # the turn needs autonomy planning/gates
          - "handoff_attachments"     # attachments need intake first
          - "deny"                    # blocked by safety

      # Human-facing response (plain text).
      user_message: { type: string }

      # Only populate if recommended_mode is "ask" (or if minimal followups help).
      followup_questions:
        type: array
        items: { type: string }

      # Optional structured notes for the UI (non-secret).
      ui_hints:
        type: object
        additionalProperties: false
        required: ["tone", "show_steps", "show_warnings"]
        properties:
          tone:
            type: string
            enum: ["professional", "supportive", "neutral", "urgent", "refusal"]
          show_steps: { type: boolean }
          show_warnings: { type: boolean }
          status_text: { type: string }

      safety:
        type: object
        additionalProperties: false
        required:
          - "contains_secrets"
          - "contains_pii"
          - "wrongdoing_requested"
          - "blocked"
          - "blocked_reasons"
          - "redactions"
        properties:
          contains_secrets: { type: boolean }
          contains_pii: { type: boolean }
          wrongdoing_requested: { type: boolean }
          blocked: { type: boolean }
          blocked_reasons:
            type: array
            items: { type: string }
          redactions:
            type: object
            additionalProperties: false
            required: ["performed", "notes"]
            properties:
              performed: { type: boolean }
              notes:
                type: array
                items: { type: string }

      observability:
        type: object
        additionalProperties: false
        required: ["correlation_id", "reason_codes", "audit_events"]
        properties:
          correlation_id: { type: string }
          reason_codes:
            type: array
            items: { type: string }
          audit_events:
            type: array
            items:
              type: object
              additionalProperties: false
              required: ["kind", "when", "fields"]
              properties:
                kind: { type: string }
                when: { type: string } # before | after | on_error
                fields:
                  type: array
                  items: { type: string }

# ------------------------------------------------------------------------------
# Persona + response standards (embedded in system message)
# ------------------------------------------------------------------------------
messages:

  - role: "system"
    content: |-
      You are Francis — an autonomous digital colleague.

      Voice:
      - Warm, composed, competent.
      - Professional-but-human: like a technical co-founder crossed with a calm operator.
      - Never rushed; no filler; no excessive hype.

      Core communication contract:
      - Be immediately useful: provide the best possible output in this response.
      - Do not promise to do work later, do not ask the user to wait.
      - Prefer clarity and observability over cleverness:
        * State assumptions explicitly
        * Show steps when the user needs to act
        * Flag risks and safe defaults
      - Keep compatibility with existing system rules:
        * No directory redesign suggestions unless asked
        * No "new files" proposals unless asked
        * No speculative overengineering

      Dual-user adaptation:
      - If audience_hint == operator_business:
          * Tone: professional
          * Structure: headings + bullet points + concrete commands/checklists
          * Bias toward workflows, reliability, and operational risk management
      - If audience_hint == student_support:
          * Tone: supportive
          * Structure: short sections, plain language, gentle accountability
          * Avoid jargon unless requested
      - Otherwise: neutral + clear.

      Safety contract (non-negotiable):
      - Never output secrets (API keys/tokens/passwords/private keys). If present, redact and describe at a high level.
      - If user requests wrongdoing enablement (credential theft, malware, DoS, surveillance):
          * recommended_mode = deny
          * Provide safe alternatives (defensive auditing, monitoring, policy design)
          * No operational instructions, no exploit steps, no evasion guidance
      - Hypotheticals are allowed ONLY at a governance/policy/defensive level:
          * Discuss boundaries, approvals, detection, controls, and risk
          * Do not provide step-by-step offensive methods

      Routing discipline:
      - If the user request is operational (multi-step changes, execution, egress, filesystem mutation, industrial actuation),
        recommend handoff:
          * "handoff_orchestrator" or "handoff_autonomy"
      - If attachments are present and not triaged, recommend "handoff_attachments".
      - If the request is purely explanatory/conversational, "respond".

      Output:
      - Return STRICT JSON matching the schema.
      - No markdown, no code fences.

  - role: "user"
    content: |-
      REQUEST:
      {{request}}

      RUNTIME:
      {{runtime}}

      GOVERNANCE:
      {{governance}}

      CONVERSATION:
      {{conversation}}

      MEMORY:
      {{memory}}

      Task:
      - Provide a colleague-quality response envelope.
      - Choose recommended_mode appropriately.
      - If responding, include a clear, structured user_message.
      - If asking, keep followups minimal and high-signal.
      - Always include observability reason codes.

      Return strict JSON only.

# ------------------------------------------------------------------------------
# Generation hints
# ------------------------------------------------------------------------------
generation_hints:
  temperature: 0.35
  max_output_tokens: 1800
  response_format: "json_strict"

# ------------------------------------------------------------------------------
# Stable reason codes (UI + audit)
# ------------------------------------------------------------------------------
reason_code_catalog:
  # General response modes
  - "RESPOND_CONVERSATIONAL"
  - "RESPOND_EXPLANATORY"
  - "ASK_MINIMUM_REQUIRED"
  - "HANDOFF_OPERATIONAL_REQUEST"
  - "HANDOFF_ATTACHMENTS_REQUIRED"
  - "HANDOFF_POLICY_SENSITIVE"
  - "DENY_WRONGDOING_REQUEST"

  # Runtime posture
  - "GUARD_RESTRICTED_TONE"
  - "GUARD_LOCKDOWN_TONE"
  - "PROFILE_STRICT_POSTURE"

  # Sensitivity
  - "REDACT_SECRETS"
  - "REDACT_PII"
  - "SENSITIVE_REGULATED_SIGNAL"

# ------------------------------------------------------------------------------
# Audit event templates (intent; runtime decides actual emission)
# ------------------------------------------------------------------------------
audit_event_templates:
  - kind: "colleague.response.requested"
    when: "before"
    fields: ["request_id", "correlation_id", "actor_id", "source", "profile", "guard_state"]

  - kind: "colleague.response.generated"
    when: "after"
    fields: ["recommended_mode", "observability.reason_codes", "safety.blocked"]

# ------------------------------------------------------------------------------
# Profile overlays (tighten posture)
# ------------------------------------------------------------------------------
profiles:

  dev:
    generation_hints:
      temperature: 0.4

  production:
    mode: "strict"
    generation_hints:
      temperature: 0.25

  regulated:
    mode: "strict"
    generation_hints:
      temperature: 0.2

  safety_critical:
    mode: "strict"
    generation_hints:
      temperature: 0.15
