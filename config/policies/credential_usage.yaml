# ==============================================================================
# Francis 2.0 — Policy Config
# Policy: Credential Usage (how credentials may be requested, used, audited)
# Path:   config/policies/credential_usage.yaml
# ==============================================================================
#
# ROLE IN THE SYSTEM
# ------------------
# Governs *use* of credentials across Francis subsystems.
# This is distinct from credential storage:
#   - Storage: how secrets are kept (vault/db/fs). (NEVER in browser.)
#   - Usage:   who/what may request, access, and apply a credential reference.
#
# It defines:
#   - Allowed credential types/providers
#   - Scope binding (domain/capability/environment)
#   - Approval requirements for request/delegate/rotate/revoke
#   - Egress safety (where credentials may be used; host allowlists)
#   - Logging posture (redaction; no secret material in logs)
#   - Audit events (request/use/failure/revocation)
#   - Rate limits and anomaly containment (quarantine/revoke)
#
# DESIGN CONTRACT
# ---------------
# - Zero-trust: credential refs are untrusted until policy validates scope + trust.
# - Least privilege: bind credentials to scopes; deny cross-scope usage.
# - Fail-closed: if cannot verify scope, deny usage.
# - No secrets in logs: redact, hash, and reference only.
# - Defense-in-depth: approvals + trust + egress controls + anomaly triggers.
#
# NOTE
# ----
# This is POLICY + CONTRACT, not implementation.
# ==============================================================================
version: 1

meta:
  owner: "francis"
  intent: "credential_usage_policy"
  notes:
    - "Credential refs must never imply permission; policy decides."
    - "Credential usage is always auditable."
    - "Egress restrictions are mandatory for credential-bearing requests."

# ------------------------------------------------------------------------------
# Global enablement + posture
# ------------------------------------------------------------------------------
credential_usage:
  enabled: true

  # Modes:
  # - disabled: do not allow credential usage at all (airgapped/hard lockdown)
  # - policy:   follow this policy (default)
  # - strict:   require approvals for most credential-bearing actions
  mode: "policy" # disabled | policy | strict

  # Fail closed means:
  # - unknown credential type/provider → deny
  # - unknown scope binding → deny
  # - unknown destination host → deny (unless explicit allow)
  fail_closed: true

  # If true, credential usage can be denied even for high trust if action readiness says "not ready".
  honor_action_readiness: true

# ------------------------------------------------------------------------------
# Credential taxonomy (what exists)
# ------------------------------------------------------------------------------
taxonomy:
  enabled: true

  # Known credential types (extendable).
  types:
    - "api_key"
    - "oauth_token"
    - "jwt"
    - "ssh_key"
    - "db_password"
    - "service_account"

  # Known providers (extendable; strings must match metadata provider in credential refs).
  providers:
    - "openai"
    - "ollama"
    - "github"
    - "aws"
    - "gcp"
    - "azure"
    - "postgres"
    - "redis"
    - "qdrant"
    - "smtp"
    - "twilio"
    - "custom"

  # Policy handling for unknown types/providers
  on_unknown_type: "deny"      # deny | require_approval | allow_with_warning
  on_unknown_provider: "deny"  # deny | require_approval | allow_with_warning

# ------------------------------------------------------------------------------
# Scope binding (the core of least privilege)
# ------------------------------------------------------------------------------
scope_binding:
  enabled: true

  # Credential refs should be bound to a scope_id and optionally domain/provider.
  require_scope_id: true

  # If true, a credential without scope_id cannot be used, even if high trust.
  deny_if_scope_missing: true

  # Scope rules:
  # - Each scope can allow certain providers/types
  # - Each scope can restrict destination hosts for network use
  # - Each scope can restrict which capabilities may use it
  #
  # NOTE: These are *usage* scopes; they can map to config/credentials scopes later.
  scopes:

    # --------------------------------------------------------------------------
    # Base system scope (internal-only, no external egress)
    # --------------------------------------------------------------------------
    system_internal:
      description: "Internal system operations (no outbound internet)."
      allowed_providers: ["postgres", "redis", "qdrant", "ollama"]
      allowed_types: ["db_password", "api_key", "service_account", "oauth_token", "jwt"]
      allowed_capabilities:
        - "^system\\."
        - "^continuity\\."
        - "^approvals\\."
        - "^plugins\\."
      network:
        allow_egress: false
        allowed_hosts: []
      approvals:
        require_on_request: true
        require_on_use: false

    # --------------------------------------------------------------------------
    # Web learning scope (explicitly egress-bearing)
    # --------------------------------------------------------------------------
    web_learning:
      description: "Outbound web retrieval/ingest/search (egress-bearing)."
      allowed_providers: ["custom", "openai", "github"] # example; extend as needed
      allowed_types: ["api_key", "oauth_token", "jwt"]
      allowed_capabilities:
        - "^web_learning\\."
      network:
        allow_egress: true
        # Host allowlist supports exact and wildcard-ish patterns (implementation-defined).
        allowed_hosts:
          - "api.openai.com"
          - "*.openai.com"
          - "raw.githubusercontent.com"
          - "github.com"
          - "*.githubusercontent.com"
        deny_hosts:
          - "169.254.169.254" # cloud metadata
          - "localhost"
          - "127.0.0.1"
          - "::1"
          - "*.local"
          - "*.lan"
      approvals:
        require_on_request: true
        require_on_use: true

    # --------------------------------------------------------------------------
    # Domains registry/export scope (sensitive exports)
    # --------------------------------------------------------------------------
    domains_sensitive:
      description: "Domain registry mutations and exports."
      allowed_providers: ["custom", "github", "aws", "gcp", "azure"]
      allowed_types: ["api_key", "oauth_token", "jwt", "service_account"]
      allowed_capabilities:
        - "^domains\\.(create|update|delete|export)$"
      network:
        allow_egress: true
        allowed_hosts:
          - "github.com"
          - "*.github.com"
          - "*.githubusercontent.com"
        deny_hosts:
          - "169.254.169.254"
          - "localhost"
          - "127.0.0.1"
          - "::1"
      approvals:
        require_on_request: true
        require_on_use: true

    # --------------------------------------------------------------------------
    # Industrial scope (highest risk)
    # --------------------------------------------------------------------------
    industrial_actuation:
      description: "Industrial control credentials (actuation)."
      allowed_providers: ["custom"]
      allowed_types: ["api_key", "oauth_token", "jwt", "service_account"]
      allowed_capabilities:
        - "^industrial\\."
      network:
        allow_egress: true
        # Usually internal network targets; still explicit allowlist.
        allowed_hosts:
          - "plc.local"
          - "*.plc.local"
          - "192.168.*"
          - "10.*"
        deny_hosts:
          - "169.254.169.254"
          - "0.0.0.0"
      approvals:
        require_on_request: true
        require_on_use: true
        # Quorum / stricter governance can be applied via approvals policy.

# ------------------------------------------------------------------------------
# Approval requirements for credential lifecycle operations
# ------------------------------------------------------------------------------
approvals:
  enabled: true

  # Credential operations are always sensitive; require approvals by default.
  require_for:
    request: true
    delegate: true
    revoke: true
    rotate: true

  # Optional: require approvals for use, depending on scope.
  # (Scope-specific flags above can override.)
  require_for_use_default: false

  # Approval metadata contract (what must be included in approval payload)
  request_metadata:
    required_fields:
      - "scope_id"
      - "provider"
      - "type"
      - "reason"
    optional_fields:
      - "domain"
      - "label"
      - "actor"
      - "ttl_s"
      - "meta"

# ------------------------------------------------------------------------------
# Trust requirements (who can request/use credentials)
# ------------------------------------------------------------------------------
trust:
  enabled: true

  # Baseline minimum trust for credential-bearing operations.
  min_trust:
    request: 6
    use: 5
    delegate: 7
    revoke: 7
    rotate: 7

  # Elevate required trust by scope.
  scope_overrides:
    web_learning:
      request: 6
      use: 6
    domains_sensitive:
      request: 7
      use: 7
    industrial_actuation:
      request: 9
      use: 9

  # If caller is unknown → deny (even for read-only).
  on_unknown_actor: "deny"

# ------------------------------------------------------------------------------
# Egress enforcement for credential-bearing network requests
# ------------------------------------------------------------------------------
egress:
  enabled: true

  # Apply egress checks to any request that includes a credential reference.
  enforce_on_credential_use: true

  # Apply egress checks also to unauthenticated network calls from sensitive capabilities.
  enforce_on_sensitive_capabilities:
    enabled: true
    capability_patterns:
      - "^web_learning\\."
      - "^domains\\.export$"
      - "^simulation\\.export$"

  # Default deny posture for destinations not explicitly allowed by scope.
  default_destination_policy: "deny" # deny | require_approval | allow_with_warning

  # Additional global deny list (defense-in-depth)
  global_deny_hosts:
    - "169.254.169.254"
    - "metadata.google.internal"
    - "localhost"
    - "127.0.0.1"
    - "::1"

  # URL sanitation before evaluation (avoid allowlist bypass).
  sanitize:
    enabled: true
    strip_userinfo: true
    strip_query_params_for_policy: true
    normalize_ports: true
    resolve_ipv6_mapped_ipv4: true

# ------------------------------------------------------------------------------
# Logging and redaction posture
# ------------------------------------------------------------------------------
logging:
  enabled: true

  # Never log credential values. Only log:
  # - credential id/ref
  # - scope_id
  # - provider/type
  # - redacted hint/fingerprint if present
  allow_fields:
    - "credential_id"
    - "scope_id"
    - "provider"
    - "type"
    - "domain"
    - "actor"
    - "capability"
    - "destination_host"
    - "result"
    - "error_code"
    - "ts"

  redact:
    enabled: true
    patterns:
      - "(?i)sk-[a-z0-9]{10,}"
      - "(?i)api[_-]?key\\s*[:=]\\s*[^\\s]+"
      - "(?i)token\\s*[:=]\\s*[^\\s]+"
      - "(?i)password\\s*[:=]\\s*[^\\s]+"
    replace_with: "[REDACTED]"

  # If an error includes response bodies, cap and scrub.
  error_body:
    enabled: true
    max_chars: 2048
    scrub_secrets: true

# ------------------------------------------------------------------------------
# Runtime handling (in-memory secrets, caching, scrubbing)
# ------------------------------------------------------------------------------
runtime:
  enabled: true

  # Browsers should never see secrets; server-side runtime still needs controls.
  in_memory:
    allow_secret_material_in_memory: true
    max_secret_lifetime_s: 300
    scrub_on_completion: true
    scrub_on_error: true

  caching:
    enabled: true
    # Cache is for credential *refs/metadata* only, not secrets.
    cache_secret_material: false
    ttl_s: 60

  # Prohibit writing secrets to disk by default.
  persistence:
    allow_secret_persistence: false
    allow_secret_persistence_with_approval: false

# ------------------------------------------------------------------------------
# Anomaly detection and containment (protect credentials)
# ------------------------------------------------------------------------------
anomaly:
  enabled: true

  # Event triggers that cause containment actions.
  triggers:
    - id: "egress_denied_burst"
      enabled: true
      window_s: 300
      threshold: 3
      action: "quarantine_actor" # quarantine_actor | revoke_credential | deny_only

    - id: "credential_use_failure_burst"
      enabled: true
      window_s: 600
      threshold: 5
      action: "require_reapproval"

    - id: "scope_mismatch_attempt"
      enabled: true
      action: "quarantine_actor"

    - id: "unknown_destination_attempt"
      enabled: true
      action: "deny_only"

  containment:
    enabled: true
    quarantine:
      ttl_s: 3600
      force_read_only: true
      require_reverification: true

# ------------------------------------------------------------------------------
# Audit events (compliance-grade traceability)
# ------------------------------------------------------------------------------
audit:
  enabled: true

  events:
    # Emitted on:
    # - request
    # - grant (after approval)
    # - use
    # - deny
    # - revoke
    # - rotate
    kinds:
      - "credentials.requested"
      - "credentials.approval_created"
      - "credentials.granted"
      - "credentials.used"
      - "credentials.use_denied"
      - "credentials.revoked"
      - "credentials.rotated"
      - "credentials.delegated"
      - "credentials.anomaly"

    include_payload: false
    include_payload_hash: true
    include_actor: true
    include_scope: true
    include_destination: true
    include_capability: true

# ------------------------------------------------------------------------------
# Profile overlays (environment-specific posture)
# ------------------------------------------------------------------------------
profiles:

  dev:
    credential_usage:
      mode: "policy"
      fail_closed: false
    approvals:
      require_for_use_default: false
    trust:
      min_trust:
        request: 4
        use: 4
        delegate: 6
        revoke: 6
        rotate: 6

  workstation:
    credential_usage:
      mode: "policy"
      fail_closed: true

  airgapped:
    credential_usage:
      mode: "strict"
    egress:
      enabled: true
      default_destination_policy: "deny"
    scope_binding:
      scopes:
        web_learning:
          network:
            allow_egress: false

  production:
    credential_usage:
      mode: "strict"
      fail_closed: true
    approvals:
      require_for_use_default: true
    runtime:
      in_memory:
        max_secret_lifetime_s: 180
    anomaly:
      triggers:
        - id: "egress_denied_burst"
          enabled: true
          window_s: 120
          threshold: 2
          action: "quarantine_actor"

  regulated:
    credential_usage:
      mode: "strict"
      fail_closed: true
    approvals:
      require_for_use_default: true
    logging:
      error_body:
        max_chars: 1024
    runtime:
      in_memory:
        max_secret_lifetime_s: 120
    trust:
      min_trust:
        request: 7
        use: 7
        delegate: 8
        revoke: 8
        rotate: 8

  safety_critical:
    credential_usage:
      mode: "strict"
      fail_closed: true
    approvals:
      require_for_use_default: true
    trust:
      min_trust:
        request: 9
        use: 9
        delegate: 10
        revoke: 10
        rotate: 10
    anomaly:
      triggers:
        - id: "scope_mismatch_attempt"
          enabled: true
          action: "revoke_credential"
