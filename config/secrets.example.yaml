# ==============================================================================
# Francis 2.0 — Secrets Template (SAFE TO COMMIT)
# Path:   config/secrets.example.yaml
# ==============================================================================
#
# ROLE IN THE SYSTEM
# ------------------
# This is a non-secret template showing the canonical keys and structure for
# Francis secrets and sensitive bindings.
#
# IMPORTANT
# ---------
# - DO NOT put real secrets in this file.
# - Copy to: config/secrets.yaml (ignored by git) and fill in real values there,
#   OR provide secrets via environment variables / vault integrations.
#
# SECRET HANDLING MODEL
# ---------------------
# Secrets are always represented as "bindings" so code does not care where
# they originate:
#   - inline (dev only)
#   - env var reference
#   - file path reference
#   - vault reference (future-ready)
#
# DESIGN CONTRACT
# ---------------
# - This file is schema-like and stable.
# - Unknown keys should be ignored by consumers (forward compatibility).
# - No secrets in git.
# ==============================================================================

version: 1

meta:
  owner: "francis"
  intent: "secrets_template"
  notes:
    - "Use bindings: inline/env/file/vault."
    - "Prefer env/file for CI and production; inline only for local dev."

# ------------------------------------------------------------------------------
# Binding primitives
# ------------------------------------------------------------------------------
# A "secret binding" is an object with:
#   type: inline | env | file | vault
#   value: (inline) placeholder string
#   env:   (env) variable name
#   path:  (file) filesystem path
#   ref:   (vault) reference string (provider-specific)
#
# Consumers should:
#   - resolve binding -> bytes/string
#   - avoid logging resolved values
#   - support redaction and safe error messages
#
bindings_examples:
  inline_example:
    type: "inline"
    value: "__REPLACE_ME__"

  env_example:
    type: "env"
    env: "FRANCIS_SOME_SECRET"

  file_example:
    type: "file"
    path: "./data/credentials/example.secret"

  vault_example:
    type: "vault"
    ref: "vault://francis/production/openai_api_key"

# ------------------------------------------------------------------------------
# Core runtime secrets
# ------------------------------------------------------------------------------
core:

  # Used to encrypt local vault database / credential material at rest (if enabled).
  # IMPORTANT: In real deployments this must be strong and protected.
  vault_master_key:
    type: "env"
    env: "FRANCIS_VAULT_MASTER_KEY"

  # Used for JWT signing/verification if FRANCIS_API_AUTH_MODE=jwt
  jwt_signing_secret:
    type: "env"
    env: "FRANCIS_JWT_SIGNING_SECRET"

  # Optional: token used if FRANCIS_API_AUTH_MODE=token
  api_bearer_token:
    type: "env"
    env: "FRANCIS_API_BEARER_TOKEN"

  # Optional: internal HMAC for signing internal messages/events (future-ready)
  internal_hmac_key:
    type: "env"
    env: "FRANCIS_INTERNAL_HMAC_KEY"

# ------------------------------------------------------------------------------
# Database / broker / vector store credentials (optional)
# ------------------------------------------------------------------------------
services:

  postgres:
    enabled: false
    dsn:
      # Example DSN binding — prefer env var in real use.
      type: "env"
      env: "POSTGRES_DSN"
    password:
      type: "env"
      env: "POSTGRES_PASSWORD"

  redis:
    enabled: false
    url:
      type: "env"
      env: "REDIS_URL"
    password:
      type: "env"
      env: "REDIS_PASSWORD"

  qdrant:
    enabled: false
    api_key:
      type: "env"
      env: "QDRANT_API_KEY"

# ------------------------------------------------------------------------------
# LLM Providers (optional; use only what you enable)
# ------------------------------------------------------------------------------
llm:

  # OpenAI-style provider key (if using OpenAI / compatible gateway)
  openai:
    enabled: false
    api_key:
      type: "env"
      env: "OPENAI_API_KEY"
    organization:
      type: "env"
      env: "OPENAI_ORG"
    project:
      type: "env"
      env: "OPENAI_PROJECT"

  # Anthropic-style provider key
  anthropic:
    enabled: false
    api_key:
      type: "env"
      env: "ANTHROPIC_API_KEY"

  # Google Gemini-style provider key
  google:
    enabled: false
    api_key:
      type: "env"
      env: "GOOGLE_API_KEY"

  # Ollama is typically local and keyless, but allow bearer if proxied.
  ollama:
    enabled: true
    bearer_token:
      type: "env"
      env: "OLLAMA_BEARER_TOKEN"

# ------------------------------------------------------------------------------
# External APIs (optional integrations)
# ------------------------------------------------------------------------------
integrations:

  github:
    enabled: false
    token:
      type: "env"
      env: "GITHUB_TOKEN"

  telegram:
    enabled: false
    bot_token:
      type: "env"
      env: "TELEGRAM_BOT_TOKEN"

  discord:
    enabled: false
    bot_token:
      type: "env"
      env: "DISCORD_BOT_TOKEN"

  smtp:
    enabled: false
    username:
      type: "env"
      env: "SMTP_USERNAME"
    password:
      type: "env"
      env: "SMTP_PASSWORD"

# ------------------------------------------------------------------------------
# Industrial / OT credentials (metadata only; never expose in UI)
# ------------------------------------------------------------------------------
industrial:

  # These are bindings for connectors (Modbus, OPC-UA, MQTT, etc.) if used.
  # Do not enable until you have governance + safety gates confirmed.
  enabled: false

  opcua:
    enabled: false
    username:
      type: "env"
      env: "OPCUA_USERNAME"
    password:
      type: "env"
      env: "OPCUA_PASSWORD"

  mqtt:
    enabled: false
    username:
      type: "env"
      env: "MQTT_USERNAME"
    password:
      type: "env"
      env: "MQTT_PASSWORD"

# ------------------------------------------------------------------------------
# Privacy / PII handling (optional)
# ------------------------------------------------------------------------------
privacy:

  # Key used to deterministically hash identifiers for pseudonymization (optional).
  pii_hash_salt:
    type: "env"
    env: "FRANCIS_PII_HASH_SALT"

# ------------------------------------------------------------------------------
# Profile overlays (examples)
# ------------------------------------------------------------------------------
profiles:

  dev:
    notes:
      - "Inline bindings are acceptable only for local dev; never commit real values."
    core:
      # Example only — do not use in real repo.
      jwt_signing_secret:
        type: "inline"
        value: "__DEV_ONLY_REPLACE_ME__"

  production:
    notes:
      - "Prefer env/vault bindings. Disable inline."
    core:
      vault_master_key:
        type: "vault"
        ref: "vault://francis/production/vault_master_key"
      jwt_signing_secret:
        type: "vault"
        ref: "vault://francis/production/jwt_signing_secret"
      api_bearer_token:
        type: "vault"
        ref: "vault://francis/production/api_bearer_token"

  regulated:
    notes:
      - "Prefer vault-backed secrets; require rotations and audit logs."
    core:
      vault_master_key:
        type: "vault"
        ref: "vault://francis/regulated/vault_master_key"
      jwt_signing_secret:
        type: "vault"
        ref: "vault://francis/regulated/jwt_signing_secret"
      internal_hmac_key:
        type: "vault"
        ref: "vault://francis/regulated/internal_hmac_key"
