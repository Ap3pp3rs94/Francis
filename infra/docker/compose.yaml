name: francis

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: francis
    ports: ["5432:5432"]
    volumes:
      - francis_pg:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports: ["6379:6379"]
    volumes:
      - francis_redis:/data

  qdrant:
    image: qdrant/qdrant:latest
    ports: ["6333:6333"]
    volumes:
      - francis_qdrant:/qdrant/storage

volumes:
  francis_pg:
  francis_redis:
  francis_qdrant:
