# =============================================================================
# Francis 2.0 — Credential Delegation Template
# Path: data/credentials/delegations/_template.delegation.yaml
# =============================================================================
#
# PURPOSE
# -------
# Defines a delegation relationship: who/what is allowed to act,
# under which scopes, constraints, and lifecycle rules.
#
# This file is a TEMPLATE.
# - Do NOT activate it directly.
# - Copy it, rename it, and fill in fields to create a real delegation.
#
# =============================================================================

delegation:
  # Unique, stable identifier for this delegation
  id: "<delegation-id>"

  # Human-readable name
  name: "<short descriptive name>"

  # Current lifecycle state
  # allowed: draft | active | suspended | revoked | expired
  status: "draft"

  # ---------------------------------------------------------------------------
  # Actors
  # ---------------------------------------------------------------------------
  # Who is granting authority, and who is receiving it
  actors:
    grantor:
      type: "human | system | domain"
      id: "<grantor-id>"

    delegate:
      type: "human | agent | service"
      id: "<delegate-id>"

  # ---------------------------------------------------------------------------
  # Scope binding
  # ---------------------------------------------------------------------------
  # References one or more scope definitions (see scopes/*.yaml)
  scopes:
    - scope_id: "<scope-id>"

  # ---------------------------------------------------------------------------
  # Constraints
  # ---------------------------------------------------------------------------
  constraints:
    # Time-based limits (UTC ISO-8601)
    valid_from: "<YYYY-MM-DDTHH:MM:SSZ | null>"
    valid_until: "<YYYY-MM-DDTHH:MM:SSZ | null>"

    # Optional usage caps
    usage_limits:
      max_actions: null          # integer or null
      max_duration_seconds: null # integer or null

    # Environment restrictions
    environment:
      allowed_hosts: []          # e.g. ["localhost", "francis-node-1"]
      allowed_networks: []       # CIDR blocks if needed

  # ---------------------------------------------------------------------------
  # Approval & audit
  # ---------------------------------------------------------------------------
  approval:
    required: true
    approved_by: null            # filled when approved
    approved_at: null            # UTC timestamp

  audit:
    created_at: "<YYYY-MM-DDTHH:MM:SSZ>"
    created_by: "<creator-id>"

    last_modified_at: null
    last_modified_by: null

  # ---------------------------------------------------------------------------
  # Metadata (non-authoritative, safe for logs)
  # ---------------------------------------------------------------------------
  meta:
    description: ""
    notes: ""
    tags: []

# =============================================================================
# RULES
# =============================================================================
# - No secrets belong in this file
# - Credentials are resolved at runtime via the vault
# - Revoked or expired delegations must never be reactivated
# - All usage must be logged to credentials/usage_logs/
# =============================================================================
