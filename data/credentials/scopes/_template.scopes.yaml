# =============================================================================
# Francis 2.0 — Scope Definitions Template
# Path: data/credentials/scopes/_template.scopes.yaml
# =============================================================================
#
# PURPOSE
# -------
# Scopes define "what actions are allowed" in a reusable way.
# Delegations reference scopes by `scope_id` (see delegations/*.yaml).
#
# This file is a TEMPLATE.
# - Do NOT rely on it as-is for production permissions.
# - Copy/rename and create real scopes files as needed.
#
# IMPORTANT
# ---------
# - No secrets in scope files.
# - Keep scopes small + least-privilege (one purpose per scope).
# - Delegations can combine multiple scope_ids when needed.
# =============================================================================

schema:
  name: "francis.credentials.scopes"
  version: "1.0"

scopes:
  # ---------------------------------------------------------------------------
  # Example: Gmail Read-Only
  # ---------------------------------------------------------------------------
  - scope_id: "google_gmail_readonly"
    name: "Google Gmail - Read Only"
    status: "draft"  # draft | active | deprecated
    provider: "google"
    services:
      - service: "gmail"
        actions:
          # Read-only actions
          - "messages.search"
          - "messages.read"
          - "threads.read"
          - "labels.list"
        resources:
          # Optional resource constraints (leave empty to allow any within account)
          # Examples:
          # - 'in:INBOX'
          # - 'label:Receipts'
          # - 'from:alerts@vendor.com'
          allowed_query_prefixes: []
    constraints:
      # Optional global constraints for this scope
      rate_limits:
        max_requests_per_minute: 60
      data_handling:
        allow_attachment_download: false
        allow_body_html: true
        redact:
          # Redaction hints for logs/UI (implementation-specific)
          - "authorization_headers"
          - "cookies"
          - "oauth_tokens"
    audit:
      risk_level: "low"
      notes: "Read-only access to Gmail metadata and bodies (no send/delete/modify)."

  # ---------------------------------------------------------------------------
  # Example: Google Calendar Read-Only
  # ---------------------------------------------------------------------------
  - scope_id: "google_calendar_readonly"
    name: "Google Calendar - Read Only"
    status: "draft"
    provider: "google"
    services:
      - service: "calendar"
        actions:
          - "events.search"
          - "events.read"
          - "calendars.list"
        resources:
          allowed_calendar_ids:
            # Examples:
            # - "primary"
            # - "team@company.com"
            - "primary"
    constraints:
      rate_limits:
        max_requests_per_minute: 60
      data_handling:
        redact:
          - "oauth_tokens"
    audit:
      risk_level: "low"
      notes: "Read-only calendar browsing for scheduling context."

  # ---------------------------------------------------------------------------
  # Example: Google Contacts Read-Only
  # ---------------------------------------------------------------------------
  - scope_id: "google_contacts_readonly"
    name: "Google Contacts - Read Only"
    status: "draft"
    provider: "google"
    services:
      - service: "contacts"
        actions:
          - "contacts.search"
          - "contacts.read"
    constraints:
      rate_limits:
        max_requests_per_minute: 60
      data_handling:
        redact:
          - "oauth_tokens"
    audit:
      risk_level: "medium"
      notes: "Contacts can contain sensitive personal data; keep use minimal."

  # ---------------------------------------------------------------------------
  # Example: Local Files Read-Only (Francis data workspace)
  # ---------------------------------------------------------------------------
  - scope_id: "local_files_readonly_francis_data"
    name: "Local Files - Read Only (Francis data)"
    status: "draft"
    provider: "local"
    services:
      - service: "filesystem"
        actions:
          - "files.list"
          - "files.read"
          - "files.stat"
        resources:
          allowed_paths:
            - "C:\\Francis\\data\\"
          denied_paths:
            # Block credentials + vault by default, even for "read"
            - "C:\\Francis\\data\\credentials\\"
            - "C:\\Francis\\data\\credentials\\vault.db"
    constraints:
      data_handling:
        redact:
          - "secrets"
          - "tokens"
          - "keys"
    audit:
      risk_level: "medium"
      notes: "Read-only to working data. Explicitly denies credentials/vault."

  # ---------------------------------------------------------------------------
  # Example: Local Files Write (VERY LIMITED)
  # ---------------------------------------------------------------------------
  - scope_id: "local_files_write_summaries_only"
    name: "Local Files - Write (summaries only)"
    status: "draft"
    provider: "local"
    services:
      - service: "filesystem"
        actions:
          - "files.write"
          - "files.append"
        resources:
          allowed_paths:
            - "C:\\Francis\\data\\conversations\\summaries\\"
          denied_paths:
            - "C:\\Francis\\data\\credentials\\"
    constraints:
      data_handling:
        require_atomic_writes: true
        allow_overwrite_existing: true
    audit:
      risk_level: "high"
      notes: "Write access is risky; confine to one folder and log every write."

# =============================================================================
# GUIDANCE
# =============================================================================
# - Keep each scope minimal (one job).
# - Prefer multiple small scopes over one broad scope.
# - Use delegations to combine scopes for a workflow.
# - Default-deny on sensitive paths/services.
# =============================================================================
