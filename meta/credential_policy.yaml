# ==============================================================================
#  FRANCIS — meta/credential_policy.yaml
#  Credential governance model: secrets, scopes, delegations, storage, rotation
# ==============================================================================
#
#  Purpose
#  -------
#  This file defines the *credential policy model* for FRANCIS:
#    - What a "credential" is (types, metadata, and secret material rules)
#    - How credentials are stored (vault, env, external secret managers)
#    - How credentials are bound to scopes + delegations (least privilege)
#    - How runtime enforces "never leak secrets" (redaction + audit controls)
#    - Lifecycle rules: create → validate → use → rotate → revoke → destroy
#    - What must be logged (usage logs) and what must NEVER be logged
#
#  Relationship to config/*
#  -------------------------
#  - meta/* files define the *model* and invariants.
#  - config/policies/* files define *deployment-specific enforcement* and thresholds.
#  - If config is missing/invalid, runtime should fall back to the safest defaults here.
#
#  Read alongside
#  -------------
#    - meta/axioms.yaml
#    - meta/trust_model.yaml
#    - meta/risk_model.yaml
#    - docs/API_PERMISSIONS.md
#    - docs/TRUST_MODEL.md
#    - docs/THREAT_MODEL.md
#    - config/policies/api_permissions.yaml
#    - config/policies/credential_usage.yaml
#    - config/policies/data_governance.yaml
#    - config/policies/privacy.yaml
#    - data/credentials/scopes/_template.scopes.yaml
#    - data/credentials/delegations/_template.delegation.yaml
#    - data/credentials/usage_logs/_template.usage.jsonl
#    - src/francis/credentials/*
#    - src/francis/governance/api_permission_gate.py
#
#  Design stance
#  ------------
#    - Default deny (no implicit authority from mere possession of a secret).
#    - Secrets are never emitted, never written to logs, never stored in provenance.
#    - Credentials must be "bound" to scopes and delegations to be usable.
#    - Rotation and revocation are first-class governance actions.
#    - Human approval gates can be required for high-impact credential changes.
#
# ==============================================================================

meta:
  model_id: francis.credential_policy
  version: 1
  stability: stable
  owner: credentials_governance
  description: >
    Credential governance model: storage backends, secret handling invariants,
    scope/delegation binding rules, lifecycle and rotation requirements, and
    logging/redaction policies.

# ------------------------------------------------------------------------------
# Canonical terms used across the system (UI, logs, schema, policy engine)
# ------------------------------------------------------------------------------
glossary:
  credential: "An authorization artifact enabling connector/provider operations."
  secret_material: "Sensitive bytes (API key, token, private key, password, refresh token)."
  credential_metadata: "Non-secret fields: id, type, provider, created_at, expires_at, labels."
  credential_ref: "A pointer to secret material stored in an approved backend (e.g., vault://...)."
  scope: "Machine-checkable restriction on tool operations + resources + methods."
  delegation: "Signed grant binding an identity to scopes (and optionally credential_refs) with constraints."
  rotation: "Replacing secret material while preserving controlled continuity of service."
  revocation: "Invalidating secret material or preventing its use by policy/runtime."
  issuer: "Actor/system that grants a delegation or registers a credential."
  subject: "Identity or service that uses the credential under scope constraints."

# ------------------------------------------------------------------------------
# Policy foundations and conflict resolution
# ------------------------------------------------------------------------------
invariants:
  - id: CP000_never_emit_secrets
    level: MUST
    statement: "Secret material MUST NEVER be emitted in model output, logs, artifacts, or provenance."
    links:
      - meta/axioms.yaml:A200_never_leak_secrets
      - meta/axioms.yaml:A201_provenance_no_secrets

  - id: CP001_default_deny_usage
    level: MUST
    statement: "Possession of a credential MUST NOT grant any authority without valid scope+delegation."
    links:
      - meta/axioms.yaml:A000_default_deny
      - docs/API_PERMISSIONS.md

  - id: CP002_bind_to_scope
    level: MUST
    statement: "Every credential used at runtime MUST be associated with at least one instantiated scope."
    rationale: "Prevents broad 'all-access' tokens from bypassing least-privilege."
    links:
      - data/credentials/scopes/_template.scopes.yaml
      - src/francis/credentials/scope_checker.py

  - id: CP003_audit_every_use
    level: MUST
    statement: "Every credential use MUST generate a usage log record (redacted, metadata-only)."
    links:
      - data/credentials/usage_logs/_template.usage.jsonl
      - src/francis/credentials/usage_logger.py

  - id: CP004_no_secrets_in_prompts
    level: MUST
    statement: "Secrets MUST NOT be inserted into LLM prompts; tools receive secrets out-of-band."
    rationale: "Prompts may be logged, cached, or exported; treat them as potentially observable."
    links:
      - src/francis/llm/context.py
      - src/francis/llm/guardrails.py

  - id: CP005_storage_backend_allowlist
    level: MUST
    statement: "Secret material MUST be stored only in approved backends; raw files are restricted."
    links:
      - config/policies/credential_usage.yaml
      - config/policies/filesystem.yaml

# When rules conflict, apply these resolution rules (consistent with axioms)
conflict_resolution:
  prefer_stricter: true
  precedence:
    - security_credentials
    - privacy_data_governance
    - permission_authority
    - auditability_provenance
    - reliability_determinism
    - usability_latency

# ------------------------------------------------------------------------------
# Credential classification and handling
# ------------------------------------------------------------------------------
classification_levels:
  public:
    description: "Non-sensitive; safe to store in repo and logs."
    allowed_in_repo: true
    allowed_in_logs: true
  internal:
    description: "Non-secret but internal metadata; safe in repo only if intended."
    allowed_in_repo: true
    allowed_in_logs: true
  confidential:
    description: "Sensitive metadata; avoid repo; allow logs only if redacted and necessary."
    allowed_in_repo: false
    allowed_in_logs: limited
  secret:
    description: "Secret material; never in repo; never in logs; never in provenance."
    allowed_in_repo: false
    allowed_in_logs: false
  regulated_secret:
    description: "Secret + regulated context; additional controls (approvals, retention, export bans)."
    allowed_in_repo: false
    allowed_in_logs: false

# ------------------------------------------------------------------------------
# Approved storage backends
# ------------------------------------------------------------------------------
storage_backends:

  # Primary local vault (recommended baseline)
  vault_db:
    id: vault_db
    type: sqlite_vault
    credential_ref_scheme: "vault://"
    path: "data/credentials/vault.db"
    secret_storage_classification: secret
    requirements:
      encryption_at_rest: MUST
      integrity_protection: MUST
      access_control: MUST
      key_management: MUST
    key_management:
      master_key_sources:
        # The vault must be decryptable without placing keys in repo.
        # Prefer OS keystore, HSM, or environment injection in CI.
        - os_keychain
        - env_var: "FRANCIS_VAULT_MASTER_KEY"
        - external_secret_manager
      forbid:
        - plaintext_key_in_repo
        - plaintext_key_in_logs
    operational_notes:
      - "Store only encrypted blobs; metadata is separate and non-secret."
      - "Support key rotation via rewrap operations."
      - "Support per-record encryption context (aad) binding to credential_id."

  # Environment variables (allowed only for dev/test or short-lived secrets)
  env:
    id: env
    type: environment_variables
    credential_ref_scheme: "env://"
    secret_storage_classification: secret
    requirements:
      encryption_at_rest: SHOULD
      # env vars are not reliably encrypted; mitigate via process isolation
      access_control: MUST
    allow_conditions:
      - environment in ["dev", "workstation", "edge"]
      - secret_is_short_lived: true
    forbid_conditions:
      - environment in ["production", "regulated", "safety_critical"]  # unless explicitly overridden in config
    operational_notes:
      - "Never echo env vars to logs."
      - "Do not pass env secrets through LLM prompt context."

  # Local secrets file (restricted; should be .gitignored; prefer references not raw secrets)
  secrets_yaml:
    id: secrets_yaml
    type: yaml_file
    path: "config/secrets.yaml"
    example_path: "config/secrets.example.yaml"
    credential_ref_scheme: "file://config/secrets.yaml#"
    secret_storage_classification: secret
    requirements:
      repo_tracked: MUST_NOT
      encryption_at_rest: SHOULD
      access_control: MUST
    allow_conditions:
      - environment in ["dev", "workstation"]
      - repo_tracked: false
    forbid_conditions:
      - environment in ["production", "regulated", "safety_critical"]
    operational_notes:
      - "Preferred: store only credential_refs to external managers or vault entries."
      - "If raw secret material exists, it must be encrypted and access-restricted."

  # External secret managers (enterprise/production recommended)
  external_secret_managers:
    - id: aws_secrets_manager
      type: external
      credential_ref_scheme: "aws-sm://"
      requirements:
        encryption_at_rest: MUST
        access_control: MUST
        auditability: MUST
    - id: azure_key_vault
      type: external
      credential_ref_scheme: "azure-kv://"
      requirements:
        encryption_at_rest: MUST
        access_control: MUST
        auditability: MUST
    - id: gcp_secret_manager
      type: external
      credential_ref_scheme: "gcp-sm://"
      requirements:
        encryption_at_rest: MUST
        access_control: MUST
        auditability: MUST
    - id: hashicorp_vault
      type: external
      credential_ref_scheme: "hv://"
      requirements:
        encryption_at_rest: MUST
        access_control: MUST
        auditability: MUST

# ------------------------------------------------------------------------------
# Supported credential types (model-level)
# ------------------------------------------------------------------------------
credential_types:

  # Generic API key (OpenAI, internal REST services, etc.)
  api_key:
    classification:
      secret_material: secret
      metadata: internal
    fields:
      required_metadata:
        - credential_id
        - provider
        - created_at
      optional_metadata:
        - label
        - description
        - expires_at
        - environment
        - tags
    secret_formats:
      - name: opaque_string
        validators:
          - not_empty
          - min_length: 12
    recommended_storage:
      - vault_db
      - external_secret_managers
    disallowed_storage:
      - repo_files
      - logs
      - prompts

  # OAuth client credentials (client_id is not secret; client_secret is secret)
  oauth_client:
    classification:
      secret_material: secret
      metadata: internal
    fields:
      required_metadata:
        - credential_id
        - provider
        - oauth:
            - client_id
            - auth_url
            - token_url
      required_secret_parts:
        - oauth_client_secret
    recommended_storage:
      - vault_db
      - external_secret_managers
    notes:
      - "Never store refresh tokens in the same record as client secret unless policy allows."
      - "client_id may be kept as internal metadata; client_secret is always secret."

  # OAuth refresh token (high-value, typically long-lived)
  oauth_refresh_token:
    classification:
      secret_material: regulated_secret
      metadata: confidential
    controls:
      approvals_for_registration: SHOULD
      approvals_for_rotation: SHOULD
      stricter_audit: true
      export_ban: true
    recommended_storage:
      - external_secret_managers
      - vault_db

  # Database credentials
  database_password:
    classification:
      secret_material: secret
      metadata: confidential
    fields:
      required_metadata:
        - credential_id
        - provider
        - database:
            - engine
            - host
            - port
            - database_name
            - username
      required_secret_parts:
        - password
    recommended_storage:
      - vault_db
      - external_secret_managers
    operational_notes:
      - "Prefer short-lived auth (IAM auth, mTLS, OAuth) where available."
      - "Scope rules must constrain allowed schemas/tables/queries if possible."

  # TLS private keys (extremely sensitive)
  tls_private_key:
    classification:
      secret_material: regulated_secret
      metadata: confidential
    controls:
      export_ban: true
      require_hardware_or_external_manager: SHOULD
      approvals_for_rotation: SHOULD
    recommended_storage:
      - external_secret_managers
      - hashicorp_vault
    disallowed_storage:
      - env
      - secrets_yaml

  # SSH private key
  ssh_private_key:
    classification:
      secret_material: secret
      metadata: confidential
    controls:
      passphrase_required: SHOULD
      export_ban: SHOULD
    recommended_storage:
      - external_secret_managers
      - vault_db

# ------------------------------------------------------------------------------
# Credential reference format (how the runtime looks up secret material)
# ------------------------------------------------------------------------------
credential_reference:
  allowed_schemes:
    - "vault://"
    - "env://"
    - "file://"
    - "aws-sm://"
    - "azure-kv://"
    - "gcp-sm://"
    - "hv://"
  requirements:
    - id: CR000_refs_not_secrets
      level: MUST
      statement: "Delegations/scopes/configs MUST reference credentials via credential_ref, not embed secrets."
    - id: CR001_ref_must_resolve
      level: MUST
      statement: "At runtime, a credential_ref must resolve to exactly one credential record or fail closed."
    - id: CR002_ref_resolution_is_audited
      level: MUST
      statement: "Credential resolution events MUST be audited (without exposing secret material)."

# ------------------------------------------------------------------------------
# Binding credentials to scopes and delegations (least privilege enforcement)
# ------------------------------------------------------------------------------
binding_rules:

  # Scope binding:
  # - A credential alone is never enough.
  # - A scope instance defines allowed tool operations/resources/methods.
  scope_binding:
    required: true
    scope_source_templates:
      - "data/credentials/scopes/_template.scopes.yaml"
    rules:
      - id: BR000_no_broad_default_scope
        level: MUST
        statement: "No credential may default to an 'all tools/all resources' scope."
      - id: BR001_scope_must_match_connector
        level: MUST
        statement: "Scopes must explicitly list allowed_tools and operations for the connector."
      - id: BR002_resource_constraints_required
        level: SHOULD
        statement: "Where the provider supports it, scopes should restrict resources (org/repo/channel/db)."

  # Delegation binding:
  # - Delegation binds subject identity to scopes (+ optional credential_refs)
  delegation_binding:
    required_for_non_baseline_identities: true
    delegation_template:
      - "data/credentials/delegations/_template.delegation.yaml"
    rules:
      - id: BR010_delegation_must_expire
        level: MUST
        statement: "Delegations must include expiration; default expiration should be short."
      - id: BR011_no_subdelegation_broadening
        level: MUST
        statement: "Sub-delegations must only narrow scope and shorten expiration."
      - id: BR012_delegation_must_be_verifiable
        level: MUST
        statement: "Delegations must be cryptographically verifiable or system-attested."

  # Tool call binding:
  tool_call_requirements:
    - id: BR020_tool_call_requires_permission_and_scope
      level: MUST
      statement: "Tool execution requires (permission allow) AND (valid scope) AND (trust/readiness allow)."
    - id: BR021_credential_usage_requires_delegation_or_baseline
      level: MUST
      statement: "If identity is not baseline-allowed, credential usage requires a valid delegation."
    - id: BR022_credential_must_not_expand_scope
      level: MUST
      statement: "Credential capabilities must never expand allowed operations beyond scope constraints."

# ------------------------------------------------------------------------------
# Logging and audit (usage logs, redaction, retention)
# ------------------------------------------------------------------------------
usage_logging:
  enabled_by_default: true
  template_path: "data/credentials/usage_logs/_template.usage.jsonl"
  required_fields:
    - timestamp
    - credential_id
    - credential_type
    - provider
    - subject_identity
    - delegation_id
    - scope_id
    - tool
    - operation
    - resource_fingerprint
    - decision: [allow, deny]
    - reason_code
    - request_id
  forbid_fields:
    - secret_material
    - raw_headers
    - raw_payload
    - full_urls_with_tokens
  redaction:
    enabled: true
    strategy: "pattern_and_schema"
    patterns:
      # NOTE: patterns are heuristic; exact provider formats vary.
      - name: generic_bearer_token
        type: regex
        pattern: "(?i)authorization\\s*:\\s*bearer\\s+[a-z0-9\\-\\._~\\+\\/]+=*"
        replacement: "authorization: Bearer [REDACTED]"
      - name: api_key_query_param
        type: regex
        pattern: "(?i)(api_key|apikey|token|access_token|refresh_token)=([^&\\s]+)"
        replacement: "\\1=[REDACTED]"
      - name: private_key_block
        type: regex
        pattern: "-----BEGIN ([A-Z ]*?)PRIVATE KEY-----[\\s\\S]*?-----END ([A-Z ]*?)PRIVATE KEY-----"
        replacement: "-----BEGIN PRIVATE KEY-----\n[REDACTED]\n-----END PRIVATE KEY-----"
  retention:
    default_days: 90
    regulated_days: 365
    rotation:
      compress_after_days: 7
      purge_after_days: null  # null means use environment-specific policy

audit_events:
  must_emit:
    - credential_registered
    - credential_resolved
    - credential_use_allowed
    - credential_use_denied
    - credential_rotated
    - credential_revoked
    - delegation_bound_to_credential
    - redaction_applied
  storage_paths:
    audit_root: "data/logs/audit"
    credential_usage_root: "data/logs/credential_usage"

# ------------------------------------------------------------------------------
# Lifecycle: creation, validation, rotation, revocation, destruction
# ------------------------------------------------------------------------------
lifecycle:

  registration:
    rules:
      - id: LC000_register_requires_metadata
        level: MUST
        statement: "Credential registration must include type/provider and non-secret metadata."
      - id: LC001_register_requires_storage_backend
        level: MUST
        statement: "Secret material must be written to an approved backend during registration."
      - id: LC002_register_may_require_approval
        level: SHOULD
        statement: "High-value credentials (refresh tokens, signing keys) should require approval."

  validation:
    # Validation may include safe provider 'ping' operations.
    # Validation must never log secrets and should respect rate limits.
    rules:
      - id: LC010_validation_is_non_destructive
        level: MUST
        statement: "Credential validation must be non-destructive and minimally invasive."
      - id: LC011_validation_outputs_redacted
        level: MUST
        statement: "Validation outputs must be redacted; never include raw headers or tokens."
    modes:
      - name: offline
        description: "Schema checks only (presence, formatting, expiry windows)."
      - name: online
        description: "Provider ping (read-only) if allowed by scope and policy."
        requires:
          - valid_scope
          - permission_allow
          - web_access_policy_allow_if_networked

  rotation:
    triggers:
      - expires_within_days: 14
      - compromise_suspected: true
      - policy_change_requires: true
    rules:
      - id: LC020_rotation_creates_new_version
        level: MUST
        statement: "Rotation must create a new credential version; old version is deprecated then revoked."
      - id: LC021_rotation_audited
        level: MUST
        statement: "Rotation must emit audit event linking old and new credential ids/versions."
      - id: LC022_rotation_may_require_approval
        level: SHOULD
        statement: "Rotation for regulated_secret types should require approval unless emergency mode."
    continuity:
      allow_overlap_minutes: 30
      enforce_cutover_deadline_minutes: 120

  revocation:
    rules:
      - id: LC030_revocation_is_immediate
        level: MUST
        statement: "Revocation must immediately block usage in permission gate and invalidate caches."
      - id: LC031_revocation_audited
        level: MUST
        statement: "Revocation must be audited with reason code (compromise, deprovision, policy)."
    cache_invalidation:
      required: true
      targets:
        - "llm/tool_sessions"
        - "connector_clients"
        - "delegation_cache"

  destruction:
    rules:
      - id: LC040_destroy_removes_secret_material
        level: MUST
        statement: "Destruction must remove/cryptographically shred secret material from storage backends."
      - id: LC041_destroy_preserves_audit_metadata
        level: SHOULD
        statement: "Keep minimal metadata/audit trail (non-secret) to preserve accountability."

# ------------------------------------------------------------------------------
# Threat-driven controls (credential-focused)
# ------------------------------------------------------------------------------
threats_and_controls:

  - threat: "prompt_injection_exfiltration"
    description: "Untrusted text attempts to coerce the system into revealing secrets."
    controls:
      - MUST: "Never place secrets in prompts; tools use out-of-band injection."
      - MUST: "Redact outputs + logs; deny any request to show secrets."
      - SHOULD: "Detect suspicious patterns and escalate to safety review."

  - threat: "scope_bypass_via_broad_token"
    description: "A broad token is used to perform operations beyond intended scope."
    controls:
      - MUST: "Permission gate checks operation/resource against scope regardless of token capability."
      - MUST: "Default deny missing resource constraints."
      - SHOULD: "Prefer provider-side restrictions (app permissions, repo allowlists)."

  - threat: "credential_reuse_across_environments"
    description: "Dev credentials used in prod or vice versa."
    controls:
      - MUST: "Tag credentials with environment and enforce environment matching."
      - SHOULD: "Use distinct providers/apps per environment."
      - SHOULD: "Short expiry in dev; stronger storage in prod."

  - threat: "log_leakage"
    description: "Secrets end up in logs through headers, URLs, or debug dumps."
    controls:
      - MUST: "Schema-based logging that forbids sensitive fields."
      - MUST: "Pattern redaction on all outbound/inbound tool traces."
      - SHOULD: "Separate debug logging channel with extra gating."

# ------------------------------------------------------------------------------
# Safe defaults used if deployment config is incomplete
# ------------------------------------------------------------------------------
defaults:
  storage_backend_preference_order:
    - vault_db
    - external_secret_managers
    - env
    - secrets_yaml
  forbid_repo_storage_for_secret_material: true
  require_scope_binding: true
  require_usage_logging: true
  deny_on_ref_resolution_failure: true
  redact_everywhere: true
  environment_guards:
    production:
      forbid_env_storage: true
      forbid_secrets_yaml: true
      require_external_or_vault: true
    regulated:
      forbid_env_storage: true
      forbid_secrets_yaml: true
      require_external_or_vault: true
      export_ban_for_regulated_secret: true

# End of meta/credential_policy.yaml
