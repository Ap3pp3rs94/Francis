name: ci

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write

jobs:
  test:
    name: test (${{ matrix.os }}, ${{ matrix.python-version }}, ${{ matrix.suite }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 135
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.12"
            suite: smoke
          - os: ubuntu-latest
            python-version: "3.13"
            suite: full
          - os: windows-2025-vs2026
            python-version: "3.12"
            suite: full
          - os: windows-2025-vs2026
            python-version: "3.13"
            suite: smoke

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install
        run: uv sync --frozen --python ${{ matrix.python-version }} --extra core --extra web --extra dev --extra bridge

      - name: Verify Python matrix
        run: |
          uv run python -c "import sys; expected='${{ matrix.python-version }}'; actual=f'{sys.version_info.major}.{sys.version_info.minor}'; assert actual == expected, f'Expected Python {expected}, got {sys.version}'; print(f'Python matrix verified: {actual}')"

      - name: Ruff (lint)
        run: uv run -m ruff check .

      - name: Ruff (format)
        run: uv run -m ruff format --check .

      - name: Mypy
        run: uv run -m mypy src

      - name: Pytest (full)
        if: matrix.suite == 'full'
        timeout-minutes: 120
        run: uv run -m pytest -vv --maxfail=1 --durations=25 --durations-min=1

      - name: Pytest (compatibility smoke)
        if: matrix.suite == 'smoke'
        env:
          FRANCIS_IMPORT_SMOKE_DEEP: "1"
        run: uv run -m pytest tests/unit/test_imports.py -m smoke -vv --maxfail=1
