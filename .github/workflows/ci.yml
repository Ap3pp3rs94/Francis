name: ci

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install
        run: uv sync --frozen --extra core --extra web --extra dev

      - name: Ruff (lint)
        run: uv run -m ruff check .

      - name: Ruff (format)
        run: uv run -m ruff format --check .

      - name: Mypy
        run: uv run -m mypy src

      - name: Pytest
        timeout-minutes: 90
        run: uv run -m pytest -vv --durations=25 --durations-min=1
