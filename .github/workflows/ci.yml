name: ci

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2025-vs2026]
        python-version: ["3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install
        run: uv sync --frozen --python ${{ matrix.python-version }} --extra core --extra web --extra dev

      - name: Verify Python matrix
        run: |
          uv run python -c "import sys; expected='${{ matrix.python-version }}'; actual=f'{sys.version_info.major}.{sys.version_info.minor}'; assert actual == expected, f'Expected Python {expected}, got {sys.version}'; print(f'Python matrix verified: {actual}')"

      - name: Ruff (lint)
        run: uv run -m ruff check .

      - name: Ruff (format)
        run: uv run -m ruff format --check .

      - name: Mypy
        run: uv run -m mypy src

      - name: Pytest
        timeout-minutes: 45
        run: uv run -m pytest -vv --maxfail=1 --durations=25 --durations-min=1
